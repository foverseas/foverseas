<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2048px;height:1152px}

       display:flex;align-items:center;justify-content:center;

  /* Zone sure YouTube : 1235x338 centree. Tout le contenu tient dedans. */
  .safe{width:1235px;height:338px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:26px;position:relative}
  .logo{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .logo span{color:#00ff99}
  .slogan{font-size:60px;font-weight:700;line-height:1.18;letter-spacing:-.02em;text-align:center}
  .slogan em{color:#00ff99;font-style:normal}
  .url{font-size:20px;color:rgba(255,255,255,.5);letter-spacing:.22em;text-transform:uppercase}
</style></head>
<body>

    <i style="top:12%;left:9%"></i><i style="top:27%;left:19%"></i><i style="top:71%;left:13%"></i>

  </div>
  <div class="safe">
    <div class="logo">Fos<span>.</span></div>
    <div class="slogan">Web platforms, mobile apps,<br>solid <em>architecture</em></div>
    <div class="url">f-overseassolutions.fr</div>
  </div>
</body></html>
