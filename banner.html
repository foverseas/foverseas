<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:360px; }
  body {
    background:#1c1c22; font-family:'JetBrains Mono',monospace; color:#fff;
    padding:46px 60px; display:flex; flex-direction:column;
    justify-content:space-between; position:relative; overflow:hidden;
  }
  .dots { position:absolute; inset:0; pointer-events:none; }
  .dots i {
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(255,255,255,.18);
  }
  .logo { font-size:30px; font-weight:700; letter-spacing:-.02em; position:relative; }
  .logo span { color:#00ff99; }
  h1 {
    font-size:46px; font-weight:700; line-height:1.18; letter-spacing:-.02em;
    position:relative;
  }
  h1 em { color:#00ff99; font-style:normal; }
  footer {
    display:flex; justify-content:space-between; align-items:flex-end;
    font-size:14px; color:rgba(255,255,255,.5); position:relative;
  }
  .name { letter-spacing:.3em; text-transform:uppercase; font-size:12px; }
  .rule { height:1px; background:rgba(255,255,255,.1); margin-bottom:22px; position:relative; }
</style></head>
<body>
  <div class="dots">
    <i style="top:14%;left:7%"></i><i style="top:30%;left:22%"></i>
    <i style="top:68%;left:12%"></i><i style="top:22%;left:63%"></i>
    <i style="top:49%;left:78%"></i><i style="top:77%;left:88%"></i>
    <i style="top:11%;left:91%"></i><i style="top:60%;left:47%"></i>
    <i style="top:86%;left:34%"></i><i style="top:40%;left:95%"></i>
  </div>

  <div class="logo">Fos<span>.</span></div>

  <h1>Web platforms, mobile apps,<br>solid <em>architecture</em></h1>

  <div>
    <div class="rule"></div>
    <footer>
      <span class="name">F-Overseas Solutions</span>
      <span>f-overseassolutions.fr</span>
    </footer>
  </div>
</body></html>
