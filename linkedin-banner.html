<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1128px;height:191px}
  body{background:#1c1c22;font-family:'JetBrains Mono',monospace;color:#fff;
       position:relative;overflow:hidden;
       /* LinkedIn pose le logo carre en bas a gauche : on laisse 300px libres */
       padding:0 60px 0 300px;
       display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:14px}
  .dots{position:absolute;inset:0;pointer-events:none}
  .dots i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.18)}
  .slogan{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;position:relative}
  .slogan em{color:#00ff99;font-style:normal}
  .url{font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.08em;position:relative}
</style></head>
<body>
  <div class="dots">
    <i style="top:20%;left:32%"></i><i style="top:62%;left:40%"></i>
    <i style="top:34%;left:88%"></i><i style="top:78%;left:70%"></i>
    <i style="top:14%;left:58%"></i><i style="top:85%;left:94%"></i>
  </div>
  <div class="slogan">Web platforms, mobile apps, solid <em>architecture</em></div>
  <div class="url">f-overseassolutions.fr</div>
</body></html>
